name: JavBoss
options:
  bundleIdPrefix: com.javboss
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4
schemes:
  JavBoss:
    build:
      targets:
        JavBoss: all
    test:
      targets:
        - JavBossTests
targets:
  JavBoss:
    type: application
    platform: iOS
    sources:
      - path: JavBoss
    dependencies:
      - package: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.javboss.ios
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: JavBoss/Info.plist
      properties:
        CFBundleDisplayName: JavBoss
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于连接局域网内的 JavBoss 服务端
  JavBossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JavBossTests
    dependencies:
      - target: JavBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.javboss.ios.tests
        GENERATE_INFOPLIST_FILE: YES
