name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要

jobs:
  build-ipa:
    name: Build unsigned IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      # 无签名构建（默认路径）：任何设备侧载前需用个人证书重签
      - name: Build unsigned (no signing)
        working-directory: ios
        run: |
          xcodebuild -project JavBoss.xcodeproj \
            -scheme JavBoss \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JavBoss.app Payload/
          # Strip macOS extra file attributes for compatibility with older
          # iOS importers based on SSZipArchive.
          zip -r -X -y JavBoss-unsigned.ipa Payload
          ls -lh JavBoss-unsigned.ipa

      - name: Publish IPA as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="自动构建产物：未签名 IPA（侧载需用 AltStore / Sideloadly 重签）。
          - 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')
          - 提交：${{ github.sha }}
          - 最低系统：iOS 16
          配置签名 Secrets（IOS_P12_BASE64 等）后，此 Release 会额外附带已签名 IPA。"
          gh release delete ios-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create ios-latest ios/JavBoss-unsigned.ipa \
            --title "JavBoss iOS 最新构建" \
            --notes "$NOTES" \
            --target main \
            --prerelease

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavBoss-ipa
          path: ios/JavBoss-unsigned.ipa
          if-no-files-found: error

  # 可选：提供签名材料时构建已签名 IPA（免侧载工具重签）
  build-signed:
    name: Build signed IPA (optional)
    needs: build-ipa
    runs-on: macos-15
    timeout-minutes: 60
    env:
      P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
      DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
    steps:
      - name: Check signing materials
        id: check
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$PROVISION_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Install XcodeGen
        if: steps.check.outputs.available == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check.outputs.available == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Import signing certificate
        if: steps.check.outputs.available == 'true'
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain

      - name: Install provisioning profile
        if: steps.check.outputs.available == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 --decode > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build signed
        if: steps.check.outputs.available == 'true'
        working-directory: ios
        run: |
          xcodebuild -project JavBoss.xcodeproj \
            -scheme JavBoss \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            build

      - name: Package signed IPA
        if: steps.check.outputs.available == 'true'
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JavBoss.app Payload/
          zip -r -X -y JavBoss-signed.ipa Payload
          ls -lh JavBoss-signed.ipa

      - name: Attach signed IPA to Release
        if: steps.check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ios-latest ios/JavBoss-signed.ipa --clobber

      - name: Upload signed IPA artifact
        if: steps.check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JavBoss-ipa-signed
          path: ios/JavBoss-signed.ipa
          if-no-files-found: error

      - name: Skip (no signing secrets)
        if: steps.check.outputs.available != 'true'
        run: echo "未配置签名 Secrets，跳过签名构建"
